<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Cobrinha</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1e1e2f;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
  }
  h1 { margin: 10px 0; }
  #scoreboard {
    display: flex;
    gap: 30px;
    margin-bottom: 10px;
    font-size: 18px;
  }
  #gameCanvas {
    background: #111122;
    border: 3px solid #4caf50;
    border-radius: 6px;
    touch-action: none;
  }
  #message {
    margin-top: 12px;
    font-size: 20px;
    min-height: 28px;
    color: #ff5555;
  }
  #controls {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  #controls .row { display: flex; gap: 6px; }
  button {
    background: #4caf50;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 18px;
    cursor: pointer;
    user-select: none;
  }
  button:active { background: #3d8b40; }
  #restartBtn {
    margin-top: 10px;
    background: #2196f3;
  }
  .hint {
    font-size: 13px;
    color: #aaa;
    margin-top: 8px;
    text-align: center;
    max-width: 420px;
  }
</style>
</head>
<body>
  <h1>🐍 Jogo da Cobrinha</h1>
  <div id="scoreboard">
    <div>Pontuação: <span id="score">0</span></div>
    <div>Recorde: <span id="highscore">0</span></div>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="message"></div>
  <button id="restartBtn">Reiniciar</button>

  <div id="controls">
    <div class="row">
      <button id="btnUp">▲</button>
    </div>
    <div class="row">
      <button id="btnLeft">◀</button>
      <button id="btnDown">▼</button>
      <button id="btnRight">▶</button>
    </div>
  </div>

  <p class="hint">Use as setas do teclado ou os botões acima para jogar. Pressione espaço para pausar.</p>

<script>
(function () {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highscoreEl = document.getElementById('highscore');
  const messageEl = document.getElementById('message');
  const restartBtn = document.getElementById('restartBtn');

  const GRID_SIZE = 20;
  const TILE_COUNT = canvas.width / GRID_SIZE;
  const BASE_SPEED_MS = 130;

  let snake, direction, nextDirection, food, score, highScore, gameOver, paused, loopId;

  highScore = Number(localStorage.getItem('snakeHighScore') || 0);
  highscoreEl.textContent = highScore;

  function resetGame() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    gameOver = false;
    paused = false;
    scoreEl.textContent = score;
    messageEl.textContent = '';
    placeFood();
    if (loopId) clearInterval(loopId);
    loopId = setInterval(tick, BASE_SPEED_MS);
  }

  function placeFood() {
    let candidate;
    do {
      candidate = {
        x: Math.floor(Math.random() * TILE_COUNT),
        y: Math.floor(Math.random() * TILE_COUNT)
      };
    } while (snake.some(seg => seg.x === candidate.x && seg.y === candidate.y));
    food = candidate;
  }

  function tick() {
    if (paused || gameOver) return;

    direction = nextDirection;
    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    // Colisão com paredes
    if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
      return endGame();
    }

    // Colisão com o próprio corpo
    if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
      return endGame();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function endGame() {
    gameOver = true;
    clearInterval(loopId);
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHighScore', highScore);
      highscoreEl.textContent = highScore;
    }
    messageEl.textContent = 'Fim de jogo! Pressione "Reiniciar" para jogar novamente.';
    draw();
  }

  function draw() {
    ctx.fillStyle = '#111122';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Comida
    ctx.fillStyle = '#ff5555';
    ctx.fillRect(food.x * GRID_SIZE + 1, food.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);

    // Cobra
    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#8bc34a' : '#4caf50';
      ctx.fillRect(seg.x * GRID_SIZE + 1, seg.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
    });

    if (paused && !gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '24px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Pausado', canvas.width / 2, canvas.height / 2);
    }
  }

  function setDirection(x, y) {
    // Impede que a cobra vire 180 graus sobre si mesma
    if (direction.x === -x && direction.y === -y) return;
    if (direction.x === x && direction.y === y && (snake.length > 1)) {
      // permitido, apenas mantém
    }
    nextDirection = { x, y };
  }

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': setDirection(0, 1); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); e.preventDefault(); break;
      case ' ':
        if (!gameOver) paused = !paused;
        draw();
        e.preventDefault();
        break;
    }
  });

  document.getElementById('btnUp').addEventListener('click', () => setDirection(0, -1));
  document.getElementById('btnDown').addEventListener('click', () => setDirection(0, 1));
  document.getElementById('btnLeft').addEventListener('click', () => setDirection(-1, 0));
  document.getElementById('btnRight').addEventListener('click', () => setDirection(1, 0));
  restartBtn.addEventListener('click', resetGame);

  // Suporte a gestos de deslizar (swipe) em telas de toque
  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy > 0 ? 1 : -1);
    }
  }, { passive: true });

  resetGame();
  draw();
})();
</script>
</body>
</html>
